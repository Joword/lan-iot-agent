[project]
name = "lan-iot-agent"
version = "0.1.0"
description = "LanIoT Agent intelligence layer — NLU + tool orchestration via LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    # litellm: optional — recent releases may require a Rust/maturin build on Windows.
    # Install with: pip install -e ".[llm]"  (or pin a wheel-only release).
]

[project.optional-dependencies]
llm = [
    "litellm>=1.50.0,<1.72.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pylint>=3.3.0",
    "pylint-pydantic>=0.3.0",
]
all = [
    "lan-iot-agent[llm,mcp,dev]",
]

[project.scripts]
lan-iot-agent = "lan_iot_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lan_iot_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/lan_iot_agent", "scripts", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Pyright / basedpyright (IDE uses the basedpyright extension). Pin to the
# pyright-equivalent "standard" ruleset so basedpyright's stricter "recommended"
# defaults (reportAny / reportUnknown* / reportExplicitAny / …) don't flood the
# Problems panel with untyped-3rd-party noise. The remaining explicit "none"
# entries silence based-only rules even if the extension forces recommended.
[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Windows"
extraPaths = ["src"]
executionEnvironments = [
  { root = ".", pythonVersion = "3.12", extraPaths = ["src"] },
]
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
# basedpyright-only strictness — off (matches pyright "standard").
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeStubs = "none"
reportMissingTypeArgument = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "none"
reportImplicitStringConcatenation = "none"
reportUninitializedInstanceVariable = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportConstantRedefinition = "none"
reportIgnoreCommentWithoutRule = "none"

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
init-hook = "import sys; from pathlib import Path; sys.path.insert(0, str(Path('src').resolve()))"

[tool.pylint.messages_control]
# Soft-fail Exception boundaries, lazy optional imports (litellm/langgraph/uvicorn),
# and orchestration complexity are intentional for this Agent — silence metrics noise.
disable = [
  "broad-exception-caught",
  "global-statement",
  "import-outside-toplevel",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-instance-attributes",
  "duplicate-code",
  "arguments-differ",
]

[tool.pylint.basic]
good-names = [
  "i", "j", "k", "ex", "Run", "_", "id", "ok",
  "do_GET", "do_POST", "do_PUT", "do_DELETE", "do_PATCH",
]

[tool.pylint.typecheck]
# Keep pydantic models recognized even without the plugin in some IDEs.
ignored-classes = ["AgentBindSettings", "HubSettings", "LlmSettings", "Settings"]
